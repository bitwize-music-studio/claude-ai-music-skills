version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    # Plugin runs in the user's venv and supports Python 3.11 (see requirements.txt).
    # scipy 1.18+, numpy 2.5+ and librosa 1.0+ require Python >=3.12, so block those
    # upgrades here. They do not merely fail tests — pip cannot resolve them at all
    # ("No matching distribution found"), which takes down every job that installs
    # requirements.txt, pip-audit included.
    ignore:
      - dependency-name: "scipy"
        versions: [">=1.18.0"]
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
      - dependency-name: "librosa"
        versions: [">=1.0.0"]
    groups:
      pip-all:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns:
          - "*"
