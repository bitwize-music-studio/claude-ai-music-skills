# IMPORTANT: `schedule` triggers only fire from the repository's DEFAULT
# branch (main) — GitHub ignores schedule triggers defined on any other
# branch. This workflow checks out `develop` explicitly in every job so the
# nightly run tests the integration branch, not whatever HEAD of main
# happens to be. In practice this means: (1) this file only starts firing
# on its cron once it has been merged to main via the next release, and
# (2) `workflow_dispatch` on main is the way to test it immediately after
# that merge, before waiting for the next 05:00 UTC tick.
name: Nightly Deep Tests

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      check-python-floor:
        description: 'Run an install-only floor check on this Python version, e.g. 3.10'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

# apt hardening options, defined ONCE per workflow file. Retries + http::Timeout
# ride out a transient mirror stall; DPkg::Lock::Timeout rides out
# unattended-upgrades holding the dpkg lock on a freshly booted runner. This
# lived as a hand-pasted shell assignment inside each apt step across three
# workflow files, and those copies had already drifted in the flags they were
# paired with — one `update -qq` and one not, one install with
# --no-install-recommends and one without.
#
# Hoisting is safe here in a way it is NOT for PYTHONUTF8 (see the job-level
# notes below): APT_OPTS is inert everywhere except an apt command line — a
# step that never runs apt never expands it, and nothing branches on it —
# whereas PYTHONUTF8 changes how every Python process decodes text, so hoisting
# THAT would silently rewrite the behaviour of the jobs that must run without
# it. The rule is about the variable, not about workflow-level env.
#
# The WSL2 job below keeps its own inline copy: workflow env does not cross the
# WSL boundary.
env:
  APT_OPTS: "-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=300"

jobs:
  deep-test:
    name: Deep Tests (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Experimental legs (3.12/3.13) prove wheel availability for the
    # scipy/numpy pins ahead of adopting them as a supported floor/ceiling —
    # promote to non-experimental once they've proven stable over time.
    #
    # ADVISORY BY DESIGN, and that is the whole point of the flag: an
    # experimental leg must never page. continue-on-error reports the JOB as
    # successful, so BOTH failures AND timeouts (a timed-out step is just a
    # failed step here) are reported to notify-failure as 'success' and can
    # never open a nightly-failure issue. Their only signal is the "Record leg
    # outcome in job summary" line further down. Removing continue-on-error is
    # the deliberate act that promotes a leg to supported and makes it page.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11']
        include:
          - os: ubuntu-latest
            python: '3.12'
            experimental: true
          - os: ubuntu-latest
            python: '3.13'
            experimental: true
    env:
      # Scoped to this job ON PURPOSE — see the note on test.yml's `test` job.
      # Do NOT hoist to workflow level: mcp-e2e must stay WITHOUT it.
      # (Job-level env does not cross the WSL boundary; wsl2-suite exports its own.)
      PYTHONUTF8: "1"

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: develop

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python }}
        # No pip cache — a from-scratch install is part of what nightly proves.

    # timeout-minutes + $APT_OPTS (workflow env, top of file): on 2026-08-19 two
    # ubuntu legs hung inside `apt-get update` with zero output (mirror stall)
    # and burned the full 90-minute job budget. The step timeout converts that
    # into a fast, clearly-attributed failure; the apt opts ride out transient
    # mirror and dpkg-lock contention (unattended-upgrades) on the runner.
    #
    # No -qq on `update`, on purpose: -qq suppresses the per-mirror Get:/Hit:
    # lines, which are the only evidence of WHICH mirror a timeout-killed step
    # was stalled on. Quiet output is worth less than an attributable hang.
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      timeout-minutes: 10
      run: |
        sudo apt-get $APT_OPTS update
        sudo apt-get $APT_OPTS install -y --no-install-recommends ffmpeg

    # Same hazard as the apt step above, different package manager: brew and
    # choco both hit third-party mirrors that can stall with no output, and a
    # stalled install burns the whole 90-minute job budget. The apt step was
    # hardened first only because apt is what happened to hang on 2026-08-19.
    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      timeout-minutes: 10
      run: |
        brew install ffmpeg

    # ffmpeg is installed on all three OSes so the ffmpeg-gated audio tests
    # run everywhere; AnthemScore/MuseScore remain WSL-recommended externals.
    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      timeout-minutes: 10
      run: choco install ffmpeg -y --no-progress

    # Every ffmpeg test gates on a module-level shutil.which("ffmpeg") skipif,
    # so a half-succeeded install (or a PATH the shim never reached) would let
    # ~10 audio tests silently skip while the leg still went green. Assert both
    # binaries resolve here instead. shell: bash runs with -eo pipefail on all
    # three OSes (Git Bash on Windows), so a missing binary fails the job.
    - name: Verify ffmpeg and ffprobe are on PATH
      shell: bash
      run: |
        ffmpeg -version
        ffprobe -version

    # Deliberately uncached (see setup-python above), so every byte comes off
    # PyPI on every run — the same network-stall class as the apt/brew/choco
    # steps, and the one that moves the most data.
    - name: Install test dependencies
      timeout-minutes: 15
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install -r requirements.txt

    - name: Run tests
      id: tests
      # No coverage gate here — coverage is the PR job's (test.yml) gate.
      # Nightly's job is proving from-scratch installs and extra Python
      # versions across all three OSes, not re-litigating coverage.
      run: |
        python -m pytest tests/ --tb=short -n auto

    # Experimental legs run under continue-on-error, which reports the JOB as
    # successful — so `needs.deep-test.result` reads 'success' and
    # notify-failure's needs-result gate never fires for them; a broken
    # 3.12/3.13 leg is invisible unless a human opens the run. Publish the real
    # step outcome to the run's summary page so every leg is legible at a
    # glance — for an experimental leg this line is the ONLY signal there is.
    # `if: always()` is required: a failed step otherwise skips the rest of the
    # job even under continue-on-error.
    - name: Record leg outcome in job summary
      if: always()
      shell: bash
      env:
        LEG: "${{ matrix.os }} / py${{ matrix.python }}"
        OUTCOME: "${{ steps.tests.outcome }}"
        TIER: "${{ matrix.experimental && 'experimental' || 'supported' }}"
      run: |
        if [ "$OUTCOME" = "success" ]; then icon="✅"; else icon="❌"; fi
        echo "$icon **$LEG** ($TIER) — tests: \`$OUTCOME\`" >> "$GITHUB_STEP_SUMMARY"

  # DELIBERATELY has no PYTHONUTF8 — same rationale as test.yml's mcp-boot job:
  # this drives a real stdio JSON-RPC handshake, so it must run in the cp1252
  # locale a real user's MCP server starts in. Adding the var here would mask
  # encoding regressions in the boot/stdio path.
  mcp-e2e:
    name: MCP e2e nightly (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: develop

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.11'
        cache: 'pip'

    # Simulates the documented user install (requirements.txt header):
    #   python3 -m venv ~/.bitwize-music/venv && pip install -r requirements.txt
    # The venv path is computed with Path.home() so it agrees byte-for-byte
    # with run.py's venv discovery (on Windows, Path.home() uses USERPROFILE
    # and ignores HOME, so a shell $HOME would be ambiguous here).
    - name: Create user-style venv and install pinned requirements
      run: |
        python -c "import pathlib, venv; venv.create(pathlib.Path.home() / '.bitwize-music' / 'venv', with_pip=True)"
        VENV_PY="$(python -c "import pathlib, sys; d = pathlib.Path.home() / '.bitwize-music' / 'venv'; print((d / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python3')).as_posix())")"
        "$VENV_PY" -m pip install --upgrade pip
        "$VENV_PY" -m pip install -r requirements.txt

    # Boot the server through the SAME launcher .mcp.json invokes, and drive a
    # real stdio JSON-RPC handshake. Catches process-level startup failures
    # (e.g. #476) that the in-process unit suite with its mocked FastMCP cannot
    # see. .mcp.json's command is the extensionless mcp-launch, which Claude Code
    # runs as the POSIX shebang script here and resolves to mcp-launch.cmd on
    # Windows (validated against real Claude Code on a Windows VM).
    - name: Boot check via mcp-launch (POSIX)
      if: runner.os != 'Windows'
      env:
        CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
      run: |
        python tests/e2e/mcp_boot_check.py --timeout 120 --call-tool health_check --scenario state-workflow -- \
          "$GITHUB_WORKSPACE/servers/bitwize-music-server/mcp-launch"

    - name: Boot check via mcp-launch.cmd (Windows)
      if: runner.os == 'Windows'
      env:
        CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
      run: |
        python tests/e2e/mcp_boot_check.py --timeout 240 --call-tool health_check --scenario state-workflow -- \
          "$GITHUB_WORKSPACE/servers/bitwize-music-server/mcp-launch.cmd"

  # Exercises the documented Windows support path ("Windows users: use WSL",
  # README) end-to-end: full pinned install + full suite inside a real WSL2
  # distro on a hosted Windows runner. Distilled from the capability probes on
  # PR #485, where this exact recipe ran green (4256 passed, 28 skipped,
  # ~11.5 min suite; install ~48s). Native Windows legs can't cover this: the
  # audio externals are WSL-recommended by support-tier decision.
  #
  # IMPORTANT: do NOT set WSL_UTF8=1 at job level. Probe-established caveat:
  # setup-wsl v7.0.0 parses wsl.exe output as UTF-16LE, and a job-level
  # WSL_UTF8=1 switches that output to UTF-8, breaking the action's WSL
  # version detection — it then fails with
  #   "This Windows environment only has WSLv1 available but WSLv2 was
  #    requested, please verify your 'runs-on' and 'wsl-version' settings"
  # on an image where WSL2 demonstrably works (and in the wsl-version: 1 path
  # it silently skips version pinning instead of erroring).
  # Chromium launch smoke test for the document-hunter dependency.
  #
  # Lives in nightly, not PR CI, on cost: chromium is ~150MB per leg and almost
  # nothing exercises it. It runs on all three OSes because browser download and
  # launch are precisely the parts that differ per platform.
  #
  # `pip install playwright` does NOT install a browser — `playwright install
  # chromium` does, out-of-band — so the cheap import check in the normal suite
  # (tests/unit/shared/test_pinned_dependencies.py) proves nothing about whether
  # a browser is usable. This closes that half.
  playwright-smoke:
    name: Playwright Chromium smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      BITWIZE_INTEGRATION: "1"

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: develop

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.11'

    # Uncached pip (no `cache: 'pip'` above) — same network-stall class as the
    # deep-test job's install step.
    - name: Install dependencies
      timeout-minutes: 15
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install -r requirements.txt

    # --with-deps pulls the system libraries chromium needs on Linux; it is a
    # no-op on macOS/Windows.
    #
    # The single least-bounded step in the workflow: a ~150MB browser download
    # from Microsoft's CDN, plus an apt transaction run INSIDE playwright on
    # Linux that this file cannot pass Acquire::Retries/Timeout options to. A
    # step timeout is the only lever available here, and without it a CDN or
    # mirror stall silently eats the job's whole 25-minute budget.
    - name: Install Chromium
      timeout-minutes: 10
      run: python -m playwright install --with-deps chromium

    - name: Run the Chromium smoke test
      run: |
        python -m pytest tests/integration/test_playwright_browser.py -m integration -v --tb=short

  wsl2-suite:
    name: WSL2 Suite (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: develop

    # Downloads and registers a full distro image on a cache miss — network
    # work this file has no other lever over, inside a 45-minute job.
    - name: Set up WSL2 (Ubuntu-24.04)
      timeout-minutes: 15
      uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364  # v7.0.0
      with:
        # Ubuntu-24.04 ships Python 3.12, which the pinned requirements
        # support; 22.04's Python 3.10 is below scipy==1.17.1's >=3.11 floor.
        distribution: Ubuntu-24.04
        wsl-version: '2'
        use-cache: 'true'

    # Runs inside the WSL distro via the wsl-bash wrapper the action generates
    # (bash --noprofile --norc -euo pipefail — fail-fast by default). The
    # Windows workspace is visible through automatic cwd translation
    # (/mnt/d/...); job-level env does NOT cross the WSL boundary. No ffmpeg
    # inside WSL — ffmpeg-gated tests skip via shutil.which fixtures, matching
    # the probe benchmark (the native legs install ffmpeg since #484, but the
    # Windows-side choco install is invisible inside the distro).
    #
    # The apt options are spelled out INLINE here rather than read from the
    # workflow-level APT_OPTS: this script runs inside the WSL distro through
    # the wsl-bash wrapper, and workflow/job env does not cross that boundary
    # (same reason PYTHONUTF8 is re-exported below). This is the fifth apt site
    # in CI and it was the last one still unhardened — a mirror stall here hangs
    # exactly like the 2026-08-19 ubuntu legs did.
    #
    # No step-level timeout on purpose: this one step both installs AND runs the
    # full suite (~11.5 min), so any cap tight enough to catch an install stall
    # would kill legitimate test runs. The job's 45-minute cap governs instead.
    - name: Install pinned requirements and run full suite inside WSL2
      shell: wsl-bash {0}
      run: |
        uname -a
        APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=300"
        apt-get $APT_OPTS update
        DEBIAN_FRONTEND=noninteractive apt-get $APT_OPTS install -y --no-install-recommends python3 python3-venv python3-pip
        python3 -m venv /tmp/wsl-venv
        /tmp/wsl-venv/bin/pip install --upgrade pip -q
        /tmp/wsl-venv/bin/pip install -q -r requirements-test.txt -r requirements.txt
        # Exported inside the distro only (Linux defaults to UTF-8 anyway —
        # parity with the native legs' PYTHONUTF8 job env).
        export PYTHONUTF8=1
        /tmp/wsl-venv/bin/python -m pytest tests/ --tb=short -n auto

  floor-check:
    # Falls back to a label when no version is given: the job is skipped in that
    # case (see `if` below), and GitHub does not expand an empty template on a
    # skipped job — so without this the run page shows the raw ${{ ... }} string.
    name: Python Floor Check (${{ inputs.check-python-floor || 'not requested' }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.check-python-floor != '' }}
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: develop

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ inputs.check-python-floor }}

    # Install-only: settles whether the documented Python floor can still
    # install the pins (e.g. dispatch with 3.10). No tests are run — this
    # job exists purely to prove `pip install` succeeds on the floor version.
    - name: Install pinned requirements
      timeout-minutes: 15
      run: |
        pip install -r requirements.txt -r requirements-test.txt

  notify-failure:
    name: Notify on Failure
    needs: [deep-test, mcp-e2e, wsl2-suite, playwright-smoke]
    # Checks needs.*.result explicitly ON PURPOSE: a job killed by its
    # timeout-minutes (e.g. the 2026-08-19 apt-mirror hang) concludes
    # "cancelled", not "failed" — with bare failure() such a night files no
    # issue and goes unnoticed.
    #
    # `!cancelled()` (which needs the ${{ }} wrapper for the `!`) rather than
    # always(), and the difference is exactly the two senses of "cancelled":
    #   - a JOB killed by its own timeout-minutes concludes 'cancelled' without
    #     the RUN being cancelled, so cancelled() stays false and this gate
    #     still fires — the hang case keeps paging, which is the point;
    #   - a RUN-level cancellation (a human hitting cancel, or concurrency
    #     cancel-in-progress superseding this nightly with a newer one) makes
    #     cancelled() true and suppresses the notification. Under always()
    #     those filed a bogus issue — and because the title is the dedupe key,
    #     that bogus issue then occupied the slot and turned every subsequent
    #     REAL failure into a comment on a phantom.
    # Skipped jobs are ignored either way: 'skipped' matches neither string,
    # so floor-check (and any conditionally-skipped leg) never pages.
    if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
    - name: Open or update nightly-failure issue
      env:
        GH_TOKEN: ${{ github.token }}
        # Per-job attribution in the body. The gate fires on 'failure' OR
        # 'cancelled' across four jobs, so "the nightly failed" alone does not
        # say which job, nor whether it failed or was killed by its timeout —
        # the reader had to open the run to find out. Interpolated through env
        # rather than straight into the script: these are a fixed vocabulary
        # today, but a needs context in a shell body is the injection shape.
        JOB_RESULTS: >-
          deep-test: ${{ needs.deep-test.result }},
          mcp-e2e: ${{ needs.mcp-e2e.result }},
          wsl2-suite: ${{ needs.wsl2-suite.result }},
          playwright-smoke: ${{ needs.playwright-smoke.result }}
      run: |
        # `// empty` keeps $existing blank when no issue matches — a bare
        # `.[0].number` would yield the literal string "null" and route the
        # first-ever failure to `gh issue comment null`.
        existing=$(gh issue list -R "$GITHUB_REPOSITORY" --label nightly-failure --state open --json number -q '.[0].number // empty')
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        # "concluded abnormally", not "failed": a 'cancelled' result is a job
        # killed by its timeout-minutes, which is a hang and not a test failure.
        body=$(printf 'Nightly run concluded abnormally — one or more jobs reported `failure` or `cancelled` (a job killed by its `timeout-minutes` concludes `cancelled`, not `failure`).\n\nPer-job results: %s\n\nRun: %s\n' "$JOB_RESULTS" "$url")
        # The title is the dedupe key — keep it stable, put the detail in the body.
        if [ -n "$existing" ]; then
          gh issue comment "$existing" -R "$GITHUB_REPOSITORY" -b "$body"
        else
          gh issue create -R "$GITHUB_REPOSITORY" -t "Nightly deep test failure" -b "$body" -l nightly-failure
        fi
